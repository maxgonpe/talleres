{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h1>{{ title }}</h1>
  <p>Compra #{{ compra.numero_compra }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Guardar</button>
    <a class="btn btn-secondary" href="{% url 'compra_detail' compra.pk %}">Cancelar</a>
  </form>
</div>
{% endblock %}
