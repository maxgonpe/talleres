{% extends "base.html" %}
{% load static %}

{% block title %}Excepción de Bono - Trabajo #{{ trabajo.id }}{% endblock %}

{% block content %}
<div  class="css004b-inline-a85693d1fc3c">
    <h1>🚫 Crear Excepción de Bono</h1>
    <p><strong>Trabajo:</strong> #{{ trabajo.id }} - {{ trabajo.vehiculo }}</p>
    
    <form method="post">
        {% csrf_token %}
        <div  class="css004b-inline-4bfb4d495798">
            <label for="motivo"  class="css004b-inline-4a1766350033">
                Motivo de la Excepción:
            </label>
            <textarea name="motivo" id="motivo" rows="4" required 
                      
                      placeholder="Explica por qué este trabajo no debe generar bonos..." class="css004b-inline-293462ba97b2"></textarea>
        </div>
        
        <button type="submit"  class="css004b-inline-5c105a16fae0">
            Crear Excepción
        </button>
        <a href="{% url 'trabajo_detalle' trabajo.id %}"  class="css004b-inline-53b36690da14">Cancelar</a>
    </form>
</div>
{% endblock %}
