{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h1>Recibir item</h1>
  <p>{{ item.repuesto.nombre }} x{{ item.cantidad }}</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-success" type="submit">Confirmar recepción</button>
    <a class="btn btn-secondary" href="{% url 'compra_detail' compra.pk %}">Cancelar</a>
  </form>
</div>
{% endblock %}
